[project]
name = "tessera"
version = "0.0.1"
description = "Tessera: local-first forensic tool for images and video (many small pieces of evidence, one clear picture)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.29",
  "pillow>=10.0",
  "numpy>=1.26",
  "c2pa-python>=0.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true

# System Pillow ships without a py.typed marker; treat it as untyped import
# only (our own annotations stay strict).
[[tool.mypy.overrides]]
module = ["PIL.*", "c2pa"]
ignore_missing_imports = true
